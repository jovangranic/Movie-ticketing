<mat-toolbar color="accent">
    <span class="title-center">Bioskop</span>
  </mat-toolbar>
  
  <div class="container mat-elevation-z8">
    <div class="filter-field">
      <mat-form-field subscriptSizing="dynamic">
        <input matInput placeholder="Unesite naziv ili adresu" name="filterField" (keyup)="applyFilter($event)"/>
      </mat-form-field>
    </div>

    <table mat-table matSort [dataSource]="dataSource" class="mat-cell">

      <ng-container matColumnDef="id">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="naziv">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
      </ng-container>

      <ng-container matColumnDef="adresa">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>Adresa</th>
        <td mat-cell *matCellDef="let row">{{ row.adresa }}</td>
      </ng-container>

      <!-- Action Buttons -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button mat-icon-button color="accent" (click)="openDialog(1)">
            <mat-icon>add</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <button
            mat-icon-button
            color="primary"
            (click)="openDialog(2, row.id, row.naziv, row.adresa)"
          >
            <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="primary"
            (click)="openDialog(3, row.id, row.naziv, row.adresa)"
          >
            <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        style="cursor: pointer"
        *matRowDef="let row; columns: displayedColumns"
      >
      </tr>
    </table>

    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
  </div>
